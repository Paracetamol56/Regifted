<li th:each="conv : ${conversations.content}" class="message-item">
  <a href="#"
    th:hx-get="@{/items/{uuid}/messages(uuid=${item.uuid}, user=${conv.participantUuid})}"
    hx-target="#owner-messages-container"
    hx-swap="innerHTML">
    <article class="conversation-card">
      <header>
        <strong th:text="${conv.participantName}"></strong>
        <small th:text="${#temporals.format(conv.lastMessageTimestamp, 'yyyy-MM-dd HH:mm')}"></small>
      </header>
      <p th:text="${conv.lastMessageSnippet}"></p>
    </article>
  </a>
</li>
