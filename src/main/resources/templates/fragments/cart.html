<th:block th:fragment="cart-content">

    <li th:if="${bundle == null or #lists.isEmpty(bundle.items)}">
        <p style="margin: 0; text-align: center;">Votre panier est vide 📭</p>
    </li>

    <th:block th:if="${bundle != null and itemsByDonor != null and !#lists.isEmpty(bundle.items)}">
        
        <div th:each="entry : ${itemsByDonor}" 
             style="margin-bottom: 20px; border: 1px solid var(--muted-border-color); padding: 10px; border-radius: 8px;">
            
            <div style="border-bottom: 1px solid var(--muted-border-color); margin-bottom: 10px; padding-bottom: 5px;">
                <small>Donneur : <strong th:text="${entry.key.email}"></strong></small>
            </div>

            <ul style="list-style: none; padding: 0; margin: 0;">
                <li th:each="cartItem : ${entry.value}"
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    
                    <span th:text="${cartItem.title}" style="font-size: 0.9rem;"></span>

                    <button
                        th:hx-delete="'/bundle/cart/items/' + ${cartItem.uuid}" 
                        hx-target="#cart-dropdown-container"
                        hx-swap="innerHTML"
                        class="outline contrast"
                        style="padding: 0 5px; font-size: 0.7rem; margin: 0; border: none; color: var(--del-color);">
                        ✕
                    </button>
                </li>
            </ul>
        </div>

        <li style="margin-top: 15px; list-style: none;">
            <button class="primary small"
                    hx-post="/bundle/checkout" 
                    hx-target="#cart-dropdown-container"
                    style="width: 100%; margin: 0;">
                Valider tout le lot
            </button>
        </li>
    </th:block>

</th:block>
