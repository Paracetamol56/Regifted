<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Register</title>
  </head>
  <body>
    <form action="/items" method="POST">
      <input name="title" placeholder="Title" />
      <textarea name="description" type="email" placeholder="Description">
      </textarea>
      <input name="latitude" type="number" placeholder="Latitude" />
      <input name="longitude" type="number" placeholder="Longitude" />
      <select name="state">
        <option value="RECYCLED">Recyclé</option>
        <option value="USED">Usagé</option>
        <option value="NEVER_USED">Jamais utilisé</option>
        <option value="EXPERIMENTED">Bien vécu</option>
      </select>

      <button type="submit">Submit</button>
    </form>
  </body>
</html>
