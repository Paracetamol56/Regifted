<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="fragments/head :: head"></head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="container item-page">
  <!-- Breadcrumb -->
  <a class="secondary" th:href="@{/items}">← Back to items</a>

  <!-- Header -->

  <section>
    <hgroup>
      <h1 th:text="${item.title}"></h1>
      
      <!-- Like / Unlike button -->
      <div th:replace="items/like-button :: likeButton(${item}, ${liked})"></div>

      <span class="badge" th:text="${item.donateAt == null} ? 'Available' : 'Unavailable'"></span>
    </hgroup>
    <p class="item-meta">
          Added by <a th:href="@{/users/{id}(id=${item.user.uuid})}" th:text="${item.user.name}"></a>
      on <time th:datetime="${item.createdAt}" th:text="${#temporals.format(item.createdAt, 'dd MMM yyyy')}"></time>
    </p>
  </section>

  <!-- Description -->

  <section>
    <h2>Description</h2>
    <p th:if="${item.description != null and !item.description.isEmpty()}" 
       th:text="${item.description}">A beautiful vintage lamp...</p>
    <p th:if="${item.description == null or item.description.isEmpty()}" 
       class="empty-state">No description provided.</p>
  </section>
  <hr/>

  <!-- Keywords -->

  <section>
    <h2>Keywords</h2>
    <p th:if="${#lists.isEmpty(item.keywords)}">No keywords associated with this item.</p>
    <ul th:unless="${#lists.isEmpty(item.keywords)}">
      <li th:each="k : ${item.keywords}">
        <a
          th:href="@{/items(keyword=${k.name})}"
          th:text="${k.name}"
        ></a>
      </li>
    </ul>
  </section>
  <hr/>

  <!-- Details -->

  <section>
    <h2>Details</h2>
    <div class="grid">
      <article>
        <header>
          <h3>Status</h3>
        </header>
        <p th:text="${item.state}">Available</p>
      </article>
      <article th:if="${owner != null}">
        <header>
          <h3>Owner</h3>
        </header>
        <p th:text="${owner}">Ajouter le user</p>
      </article>
      <article th:if="${item.donateAt != null}">
        <header>
          <h3>Donated</h3>
        </header>
        <p th:text="${#temporals.format(item.donateAt, 'dd MMM yyyy')}"></p>
      </article>
      <article>
        <header>
          <h3>Location</h3>
        </header>
        <p>
          <a th:href="'https://www.google.com/maps?q=' + ${item.latitude} + ',' + ${item.longitude}" 
            target="_blank" rel="noopener">View map ↗</a>
        </p>
      </article>
    </div>
  </section>
  <hr/>

  <!-- Actions -->
  <section th:if="${isOwner}">
    <a th:href="@{/items/update/{id}(id=${item.uuid})}" role="button">Edit item</a>
    <button aria-label="Delete item"
            th:hx-delete="@{/items/{id}(id=${item.uuid})}"
            hx-confirm="Are you sure you want to delete this item?">
      Delete item
    </button>
  </section>

  <!-- Messages -->
  <section>
    <h3>Messages</h3>
    
    <div th:unless="${isOwner}" id="not-owner-messages-container">
      <ul
        id="message-list"
        th:hx-get="@{/items/{uuid}/messages(uuid=${item.uuid}, page=0)}"
        hx-trigger="load"
        hx-target="#message-list"
        hx-swap="innerHTML"
        hx-headers='{"Accept": "text/html"}'
        style="list-style: none; padding: 0;"
      >
      </ul>

      <form
        th:hx-post="@{/items/{uuid}/messages(uuid=${item.uuid})}"
        hx-target="#message-list"
        hx-swap="beforeend"
        hx-on="htmx:afterOnLoad: this.reset()"
      >
        <div>
          <label for="messageContent">Send a message to the owner:</label>
          <textarea id="messageContent" name="content" rows="4" required></textarea>
        </div>
        <button type="submit">Send</button>
      </form>
    </div>

    <!-- Container for either conversation list or messages -->
    <div th:if="${isOwner}" id="owner-messages-container">
      <ul id="conversation-list"
          th:hx-get="@{/items/{uuid}/messages(uuid=${item.uuid})}"
          hx-trigger="load"
          hx-target="#conversation-list"
          hx-swap="innerHTML"
          hx-headers='{"Accept": "text/html"}'
          style="list-style: none; padding: 0;">
      </ul>
    </div>
  </section>

    
  </section>
</main>

<div th:replace="fragments/footer :: footer"></div>

<style>
  hgroup {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
  }

  hgroup h1 { flex: 1; }
</style>

</body>
</html>
