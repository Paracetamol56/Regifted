<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="fragments/head :: head"></head>
<body>
  <div th:replace="fragments/header :: header"></div>
  <main class="container">
    <h1>Mise à jour de l'objet</h1>
    
    <!-- Message de succès/erreur -->
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    
   <form th:action="@{/items}" th:object="${item}" method="post">
      <fieldset>
        <label for="title">Titre</label>
        <input id="title" th:field="*{title}" required maxlength="100"/>
      </fieldset>

      <fieldset>
        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}" required maxlength="500"></textarea>
      </fieldset>

      <fieldset>
        <label>Mots-clés</label>
        <div>
            <input th:each="kw, iter : *{keywords}"
                th:field="*{keywords[__${iter.index}__].name}" type="text"
                placeholder="Mot-clé"/>
        </div>
        <button type="button" onclick="addKeyword()">Ajouter un mot-clé</button>
      </fieldset>

      <fieldset>
        <label for="latitude">Latitude</label>
        <input id="latitude" th:field="*{latitude}" type="number" step="0.000001" min="-90" max="90" required/>
      </fieldset>

      <fieldset>
        <label for="longitude">Longitude</label>
        <input id="longitude" th:field="*{longitude}" type="number" step="0.000001" min="-180" max="180" required/>
      </fieldset>

      <fieldset>
        <label for="state">État</label>
        <select id="state" th:field="*{state}">
          <option value="" disabled selected>Sélectionner</option>
          <option value="RECYCLED">Recyclé</option>
          <option value="USED">Usagé</option>
          <option value="NEVER_USED">Jamais utilisé</option>
          <option value="EXPERIMENTED">Bien vécu</option>
        </select>
      </fieldset>

      <button type="submit">Soumettre</button>
    </form>

  </main>
  <div th:replace="fragments/footer :: footer"></div>
</body>
</html>


<script>
function addKeyword() {
  const container = document.querySelector('[th\\:each]');
  const clone = container.cloneNode(true);
  clone.querySelector('input').value = '';
  container.parentNode.appendChild(clone);
}
</script>
