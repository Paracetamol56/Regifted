<header th:fragment="header" class="container-fluid">
  <nav class="container">
    <ul>
      <li><strong><a th:href="@{/}">Regifted</a></strong></li>
    </ul>
    <ul>
      <li><a th:href="@{/items}">Browse</a></li>
      <li><a th:href="@{/new-item}">Add Item</a></li>
    </ul>
    <ul>
      <li sec:authorize="isAnonymous()">
        <a th:href="@{/register}" class="secondary">Register</a>
      </li>

      <li sec:authorize="isAuthenticated()">
        <details class="dropdown">
          <summary class="outline secondary" 
                   hx-get="/bundles/cart" 
                   hx-target="#cart-dropdown-container" 
                   hx-trigger="click">
            Panier
          </summary>
          <ul id="cart-dropdown-container" style="min-width: 320px; right: 0; left: auto; padding: 1rem;">
            <li><small>Chargement...</small></li>
          </ul>
        </details>
      </li>

      <li sec:authorize="isAuthenticated()">
        <a th:href="@{/users/me}">Profile</a>
      </li>
      
      <li>
        <select id="theme-select" style="margin-bottom: 0;">
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </li>
    </ul>
  </nav>
</header>
