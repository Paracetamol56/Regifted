<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/head :: head"></head>
  <body>
    <div th:replace="fragments/header :: header"></div>
    <main class="container">
      <h1 th:text="${user.name}"></h1>
      <section>
        <h2>Personal information</h2>
        <p>
          <strong>Email:</strong>
          <span th:text="${user.email}"></span>
        </p>

        <p>
          <strong>Member since:</strong>
          <span th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}"></span>
        </p>

        <p>
          <strong>Notifications enabled:</strong>
          <span th:text="${user.notification ? 'Yes' : 'No'}"></span>
        </p>

        <!-- logout button (forget the http basic auth and redirect to home) -->
        <form th:action="@{/logout}" method="post">
          <button type="submit">Logout</button>
        </form>
      </section>

      <section>
        <h2>Items for donation</h2>
        <p th:if="${#lists.isEmpty(user.items)}">This user has no items for donation.</p>
        <ul>
          <li th:each="i : ${user.getItems()}">
            <a th:href="@{/items/{uuid}(uuid=${i.uuid})}" th:text="${i.title}"></a>
          </li>
        </ul>
      </section>

      <section>
        <h2>Liked items</h2>
        <ul>
          <li th:each="i : ${user.getLikedItems()}">
            <a th:href="@{/items/{uuid}(uuid=${i.uuid})}" th:text="${i.title}"></a>
          </li>
        </ul>
      </section>

      <section>
        <h2>Saved search</h2>
        <ul>
          <li th:each="s : ${user.getSavedSearches()}">
            <a th:href="@{/users/me/searches/{uuid}(uuid=${s.getUuid()})}" th:text="${s.getQuery()}"></a>
            <a 
              hx-delete th:hx-delete="@{/users/me/searches/{uuid}(uuid=${s.getUuid()})}"
              hx-confirm="Are you sure you want to delete this saved search?"
              hx-target="closest li"
              hx-swap="outerHTML"
              style="color: red; margin-left: 1rem; cursor: pointer;">
              Delete
            </a>
          </li>
        </ul>
      </section>
    </main>
    <div th:replace="fragments/footer :: footer"></div>
  </body>
</html>
