<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Items</title>
  </head>
  <body>
    <h1>All Items</h1>
    <ul>
      <li th:each="item : ${items}">
        <a th:href="@{/items/{uuid}(uuid=${item.uuid})}" th:text="${item.title}"></a>
      </li>
    </ul>
  </body>
</html>
