<div id="like-btn" th:fragment="likeButton(item, liked)">
  
  <!-- Unlike button (filled heart) -->
  <button th:if="${liked}"
          class="contrast"
          aria-label="Remove like"
          th:hx-delete="@{/users/me/likes(item=${item.uuid})}"
          hx-target="#like-btn"
          hx-swap="outerHTML">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#e01b24" stroke="#e01b24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart-icon lucide-heart"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
    <span th:text="${item.likes}">0</span>
  </button>

  <!-- Like button (hollow heart) -->
  <button th:unless="${liked}"
          class="contrast "
          aria-label="Add like"
          th:hx-post="@{/users/me/likes(item=${item.uuid})}"
          hx-target="#like-btn"
          hx-swap="outerHTML">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e01b24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart-icon lucide-heart"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
    <span th:text="${item.likes}">0</span>
  </button>
</div>
